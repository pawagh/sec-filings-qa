[project]
name = "secqa"
version = "0.1.0"
description = "SEC filings Q&A: SQL over XBRL facts + hybrid pgvector RAG over 10-K text"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pgvector>=0.3",
  "pydantic-settings>=2.4",
  "sentence-transformers>=3.0",
  "langchain-core>=0.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "prometheus-client>=0.20", "langchain-google-genai>=2.0", "httpx>=0.27"]
ui = ["streamlit>=1.38", "httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
secqa-etl = "secqa.etl.run:main"
secqa-migrate = "secqa.db:main"
secqa-embed = "secqa.rag.embeddings:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs a Postgres+pgvector at TEST_DATABASE_URL"]
