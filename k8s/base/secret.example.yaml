# NOT applied by kustomize. Create the real Secret out-of-band, e.g.:
#   kubectl -n secqa create secret generic secqa-secrets \
#     --from-literal=POSTGRES_PASSWORD='change-me' \
#     --from-literal=DATABASE_URL='postgresql://secqa:change-me@postgres:5432/secqa' \
#     --from-literal=SEC_USER_AGENT='secqa-portfolio-project you@example.com' \
#     --from-literal=GEMINI_API_KEY=''
apiVersion: v1
kind: Secret
metadata:
  name: secqa-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql://secqa:change-me@postgres:5432/secqa
  SEC_USER_AGENT: secqa-portfolio-project you@example.com
  GEMINI_API_KEY: ""
