# Weekly refresh. Loads are idempotent, so retries and overlapping schedules are safe; Forbid avoids wasted work.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secqa-etl
spec:
  schedule: "0 6 * * 1"           # Mondays 06:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 10001 }
          containers:
            - name: etl
              image: secqa-api
              command: ["secqa-etl"]
              envFrom:
                - configMapRef: { name: secqa-config }
                - secretRef: { name: secqa-secrets }
              resources:
                requests: { cpu: "1", memory: 2Gi }
                limits: { memory: 4Gi }
              volumeMounts:
                - { name: cache, mountPath: /tmp/edgar-cache }
          volumes:
            - name: cache
              emptyDir: { sizeLimit: 2Gi }
